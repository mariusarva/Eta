name: Eta Fork Release

# 出 R8 优化过的 release 包：debug 变体不开混淆与资源裁剪，Compose 与 Kotlin 也拿不到
# 发布级优化，界面操作明显更卡。这里在 CI 现场生成签名（设备已核心破解，可无视签名升级）。
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        shell: bash
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 生成 CI 签名
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/eta-ci.jks" -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 -alias eta \
            -storepass etacipass -keypass etacipass \
            -dname "CN=Eta CI, OU=Fork, O=Eta, L=NA, ST=NA, C=CN"

      - name: 构建 Release APK
        shell: bash
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-ci.jks
          ETA_RELEASE_STORE_PASSWORD: etacipass
          ETA_RELEASE_KEY_ALIAS: eta
          ETA_RELEASE_KEY_PASSWORD: etacipass
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          "-Peta.buildMetadata=${GITHUB_SHA::7}"
          :app:assembleRelease

      - name: 整理产物
        id: apk
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/Eta-v*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Release APK 数量异常（${#apks[@]}）"
            ls -R app/build/outputs || true
            exit 1
          fi
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
          ls -l "${apks[0]}"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14