name: Eta Fork Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        shell: bash
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 构建 Debug APK
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          "-Peta.buildMetadata=${GITHUB_SHA::7}"
          :app:assembleDebug

      - name: 整理产物
        id: apk
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/Eta-v*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Debug APK 数量异常（${#apks[@]}）"
            ls -R app/build/outputs || true
            exit 1
          fi
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
          ls -l "${apks[0]}"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14